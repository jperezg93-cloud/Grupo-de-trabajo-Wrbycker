name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test suite
        run: python -m unittest discover -s tests -v
  javascript:
    name: Browser app logic and PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check docs/app/logic.js
          node --check docs/app/app.js
          node --check docs/app/sw.js
          node --check docs/main.js
      - name: Offline application tests
        run: node --test tests/test_app_logic.cjs
