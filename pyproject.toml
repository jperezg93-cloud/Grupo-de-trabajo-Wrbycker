[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wrbycker-agent-lab"
version = "0.2.0"
description = "Educational supervised agent with read-only offline reports, constrained tools and audit trail"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Wrbycker contributors"}]
keywords = ["ai", "agents", "responses-api", "human-in-the-loop", "open-source"]

[project.scripts]
wrbycker-agent = "wrbycker_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["wrbycker_agent*"]
